# 동시에 도는 러너 수와 자원 총량 제한 (리뷰 하나 = base · head 러너 2개)
apiVersion: v1
kind: ResourceQuota
metadata:
  name: prguard-runs-quota
  namespace: prguard-runs
spec:
  hard:
    pods: "10"
    requests.cpu: "4"
    requests.memory: 8Gi
    limits.cpu: "16"
    limits.memory: 32Gi
---
# 러너가 한도를 안 적어도 기본값이 붙게
apiVersion: v1
kind: LimitRange
metadata:
  name: prguard-runs-defaults
  namespace: prguard-runs
spec:
  limits:
    - type: Container
      default:
        cpu: "2"
        memory: 3Gi
      defaultRequest:
        cpu: 250m
        memory: 512Mi
      max:
        cpu: "4"
        memory: 6Gi
