# 실행 검증 러너 이미지(runner/)를 GHCR 에 올린다
name: runner-image

on:
  push:
    branches: [main]
    paths: ["runner/**", ".github/workflows/runner-image.yml"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: runner
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/pr-guard-test-runner:latest
            ghcr.io/${{ github.repository_owner }}/pr-guard-test-runner:${{ github.sha }}
