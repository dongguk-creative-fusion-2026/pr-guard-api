name: invariant-check
run-name: invariant ${{ inputs.run_id }}

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: PR Guard execution UUID
        required: true
      head_sha:
        description: Pinned sandbox head commit
        required: true
      base_sha:
        description: Pinned sandbox merge-base commit
        required: true

permissions:
  contents: read

concurrency:
  group: prguard-invariant
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: invariant-poc
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Hypothesis
        run: python -m pip install --disable-pip-version-check -r invariant-poc/requirements.txt
      - name: Validate and prepare plan
        env:
          REQUEST_ID: ${{ inputs.run_id }}
          HEAD_SHA: ${{ inputs.head_sha }}
          BASE_SHA: ${{ inputs.base_sha }}
        run: |
          python - <<'PY'
          import json, os, re, uuid
          from pathlib import Path
          request_id = str(uuid.UUID(os.environ['REQUEST_ID']))
          for name in ('HEAD_SHA', 'BASE_SHA'):
              if not re.fullmatch('[0-9a-f]{40}', os.environ[name]):
                  raise ValueError('Invalid commit')
          plan = {'requestId': request_id, 'ruleId': 'post-author-preserved-on-update',
                  'version': 1, 'headSha': os.environ['HEAD_SHA'], 'baseSha': os.environ['BASE_SHA']}
          Path(os.environ['RUNNER_TEMP'], 'invariant-plan.json').write_text(json.dumps(plan))
          PY
      - name: Execute property tests
        env:
          INVARIANT_WORKDIR: ${{ runner.temp }}/invariant-work
        run: |
          python invariant-poc/runner/run.py < "$RUNNER_TEMP/invariant-plan.json" > "$RUNNER_TEMP/invariant-result.json"
      - name: Retain small result for API collection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: invariant-${{ inputs.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/invariant-result.json
          retention-days: 1
          if-no-files-found: ignore
          compression-level: 0
