plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.6'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.prguard'
version = '0.1.0'

java {
    toolchain { languageVersion = JavaLanguageVersion.of(21) }
}

repositories { mavenCentral() }

sourceSets {
    integrationTest {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}

configurations {
    integrationTestImplementation.extendsFrom testImplementation
    integrationTestRuntimeOnly.extendsFrom testRuntimeOnly
    mockitoAgent
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    // 레포 인덱스: Java 소스 파싱
    implementation 'com.github.javaparser:javaparser-core:3.26.4'
    // AST 단위 diff (삽입 · 삭제 · 수정 · 이동). LGPL-3.0, 라이브러리로만 쓴다
    implementation 'com.github.gumtreediff:core:4.0.0-beta3'
    implementation 'com.github.gumtreediff:gen.javaparser:4.0.0-beta3'
    // 실행 검증: 쿠버네티스 Job 으로 PR 의 테스트를 돌린다
    implementation 'io.fabric8:kubernetes-client:7.3.1'
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-database-postgresql'
    runtimeOnly 'org.postgresql:postgresql'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    // Java 21 / Windows: attach 권한에 의존하지 않고 테스트용 계측을 JVM 시작 때 준비한다.
    mockitoAgent('org.mockito:mockito-core') { transitive = false }
}

bootJar { archiveFileName = 'app.jar' }

tasks.named('test') { useJUnitPlatform() }

tasks.withType(Test).configureEach {
    doFirst { jvmArgs "-javaagent:${configurations.mockitoAgent.singleFile.absolutePath}" }
}

tasks.register('guarddogIntegrationTest', Test) {
    description = 'Runs real GuardDog CLI and PostgreSQL review-flow verification (explicit opt-in).'
    group = 'verification'
    testClassesDirs = sourceSets.integrationTest.output.classesDirs
    classpath = sourceSets.integrationTest.runtimeClasspath
    reports.junitXml.outputLocation = layout.buildDirectory.dir('reports/guarddog/junit')
    useJUnitPlatform()
    shouldRunAfter tasks.named('test')
}
