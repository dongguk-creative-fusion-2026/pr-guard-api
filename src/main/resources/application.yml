server:
  port: ${PORT:8080}

spring:
  application:
    name: pr-guard-api
  servlet:
    multipart:
      # 실행 검증 러너가 보내는 JUnit 보고서들
      max-file-size: 10MB
      max-request-size: 60MB
  datasource:
    url: jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:prguard}
    username: ${PGUSER:prguard}
    password: ${PGPASSWORD:prguard}

management:
  endpoints:
    web:
      exposure:
        include: health

prguard:
  api:
    # 있으면 /api/** 는 X-Api-Token 헤더가 이 값이어야 받는다 (pr-guard-web 의 API_TOKEN 과 같은 값). 콜백(웹훅 · 러너 · 그래프)은 제외
    token: ${API_TOKEN:}
  github:
    api-url: https://api.github.com
    token: ${GITHUB_TOKEN:}
    comment-enabled: ${GITHUB_COMMENT_ENABLED:true}
  openai:
    api-url: https://api.openai.com/v1
    api-key: ${OPENAI_API_KEY:}
    model: ${OPENAI_MODEL:gpt-4o-mini}
  poll:
    interval: ${POLL_INTERVAL:PT5M}
  webhook:
    # GitHub 웹훅 secret. 있으면 POST /api/github/webhook 으로 PR 이벤트를 받아 바로 리뷰한다 (폴링은 그대로 돈다)
    secret: ${GITHUB_WEBHOOK_SECRET:}
  review:
    worker-delay: ${REVIEW_WORKER_DELAY:PT10S}
    # 리뷰어에 넘기는 patch 총 길이 상한 (문자 수)
    max-patch-chars: ${REVIEW_MAX_PATCH_CHARS:60000}
    # running 인 채로 이 시간이 지나면 죽은 작업으로 보고 다시 집는다
    stale-after: PT15M
  workspace:
    # 레포 clone 과 PR 별 worktree 위치
    dir: ${WORKSPACE_DIR:${java.io.tmpdir}/prguard}
    # 이보다 큰 레포는 받지 않는다 (KB)
    max-repo-kb: ${WORKSPACE_MAX_REPO_KB:300000}
    git-timeout: PT3M
    keep-mirror: P3D
  execution:
    # 실행 검증: PR 의 base · head 에서 레포 테스트를 돌려 회귀를 찾는다.
    # none: 끔(화면에 "실행 환경 준비 중"), kubernetes: Job (클러스터 안이면 서비스 계정, 밖이면 KUBECONFIG), docker: 로컬 개발
    runner: ${EXEC_RUNNER:none}
    image: ${EXEC_IMAGE:ghcr.io/dongguk-creative-fusion-2026/pr-guard-test-runner:latest}
    # 러너가 진행 · 결과를 보낼 이 API 주소 (러너 쪽에서 닿는 주소)
    callback-url: ${EXEC_CALLBACK_URL:http://localhost:8080}
    namespace: ${EXEC_NAMESPACE:prguard-runs}
    # 격리 런타임 (예: gvisor). 비우면 기본 런타임
    runtime-class: ${EXEC_RUNTIME_CLASS:}
    cpu: ${EXEC_CPU:2}
    memory: ${EXEC_MEMORY:3Gi}
    timeout: ${EXEC_TIMEOUT:PT15M}
    poll-interval: PT2S
    cache:
      # 러너 의존성 캐시 (Gradle · Maven). base 는 읽기 · 쓰기, head(PR 코드)는 읽기 전용, 프로젝트마다 다른 칸
      enabled: ${EXEC_CACHE:false}
      # 쿠버네티스: 캐시 PVC (deploy/k8s/runner-cache.yaml). docker 러너는 이름 붙은 볼륨을 쓴다
      pvc: ${EXEC_CACHE_PVC:prguard-runner-cache}
    mutation:
      # 변경분 변이 테스트: 바뀐 메서드에 작은 버그를 심어(PIT) 테스트가 잡는지 본다. head 실행에서만
      enabled: ${EXEC_MUTATION:true}
      max-classes: 5
      timeout: ${EXEC_MUTATION_TIMEOUT:PT6M}
    selection:
      # 영향 테스트 선택. on: 바뀐 코드를 지나가는 테스트만 base · head 에서 돌림,
      # shadow: 전체를 돌리되 "골랐다면"을 기록해 놓친 실패가 없는지 확인, off: 늘 전체
      mode: ${EXEC_TEST_SELECTION:on}
      # 기준(전체 실행 기록)이 이보다 오래되면 전체를 돌린다
      max-reference-age: ${EXEC_SELECTION_MAX_AGE:P14D}
      # 호출 그래프에서 바뀐 메서드를 부르는 테스트를 찾을 때 거슬러 올라가는 단계
      static-depth: 4
  evidence:
    # 증거 테스트: 바뀐 메서드마다 base 통과 · head 실패하는 테스트를 LLM 으로 써서 함께 돌린다 (OPENAI_API_KEY 필요)
    enabled: ${EVIDENCE_ENABLED:true}
    # 있으면 LLM 대신 {dir}/{owner}/{repo}/{PR 번호}/ 아래 미리 써 둔 테스트를 쓴다 (로컬 · 시연)
    fixture-dir: ${EVIDENCE_FIXTURE_DIR:}
    max-targets: 3
  graph:
    # 레포 전체 파일 의존성 그래프 (GitNexus).
    # ACTIONS: 이 레포의 .github/workflows/repo-graph.yml 을 실행하고 결과를 /api/projects/{id}/graph/result 로 받는다
    # LOCAL: 이 서버에서 직접 만든다 (gitnexus/ 에서 npm ci, node 필요. 메모리 1GB 이상 따로 필요)
    runner: ${GRAPH_RUNNER:actions}
    workflow-repo: dongguk-creative-fusion-2026/pr-guard-api
    workflow: repo-graph.yml
    workflow-ref: main
    dispatch-token: ${GRAPH_DISPATCH_TOKEN:}
    node: ${GRAPH_NODE:node}
    script: ${GRAPH_SCRIPT:gitnexus/export.mjs}
    timeout: ${GRAPH_TIMEOUT:PT15M}
    max-nodes: 400
    heap-mb: ${GRAPH_HEAP_MB:2048}
    worker-delay: PT10S
    # 워크플로 제한 시간(30분)보다 길게
    stale-after: PT40M
  sonar:
    # SonarCloud: 등록된 레포마다 우리 조직 아래 public 프로젝트를 만들고, head 러너가 테스트 뒤 sonar-scanner 로 PR 분석을 올린다.
    # 이번 PR 이 추가한 줄의 이슈 · 새 코드 커버리지 · 중복률 · Quality Gate 를 리뷰에 싣는다. 실행 검증(EXEC_RUNNER)이 켜져 있어야 돈다
    enabled: ${SONAR_ENABLED:false}
    url: ${SONAR_URL:https://sonarcloud.io}
    organization: ${SONAR_ORGANIZATION:}
    # 조직 관리자 토큰 (프로젝트 만들기 · 분석 올리기). head 러너에는 테스트가 끝난 뒤 한 번만 건넨다
    token: ${SONAR_TOKEN:}
    project-prefix: prguard_
    # 러너가 올린 분석을 SonarCloud 가 처리하기를 기다리는 시간
    timeout: ${SONAR_TIMEOUT:PT5M}
    # Quality Gate 실패를 남길 심각도 (기본 Sonar way 는 새 코드 커버리지 80% 를 요구해 자주 실패한다)
    gate-severity: ${SONAR_GATE_SEVERITY:MINOR}
    max-issues: 50
  semgrep:
    # C. 보안: 바뀐 파일을 base · head 에서 Semgrep 으로 검사해 이번 PR 이 추가한 줄의 결과만 남긴다.
    # 실행 파일(semgrep)이 없으면 건너뛴다 (API 이미지에는 들어 있다)
    enabled: ${SEMGREP_ENABLED:true}
    binary: ${SEMGREP_BIN:semgrep}
    # 규칙: 레지스트리 이름(p/...) 또는 규칙 파일 경로. 쉼표로 여러 개
    configs: ${SEMGREP_CONFIGS:p/default}
    timeout: ${SEMGREP_TIMEOUT:PT3M}
    max-files: 200
  analysis:
    max-commits: 1000
    min-co-support: 3
    min-confidence: 0.5
    max-structure-chars: 6000
  links:
    # PR 코멘트의 "분석 과정 보기" 링크 대상 (pr-guard-web)
    web-url: ${WEB_URL:https://pr-guard-web.vercel.app}
  verdict:
    # MAJOR 가 이 개수 이상이면 "수정 후 머지" (BLOCKER 는 1개만 있어도 "머지 비권장")
    major-threshold: 1
